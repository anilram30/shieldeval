[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldeval"
version = "4.0.0"
description = "Shield transfer impedance and screening attenuation from triaxial / line-injection measurements: legacy-exact compatibility mode, modern model-based evaluation, new fixtures."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreeram Anil" }]
keywords = ["emc", "shielding-effectiveness", "transfer-impedance", "legacy-modernization", "reverse-engineering", "cable-testing", "measurement", "iec-62153", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/anilram30/shieldeval"
Toolchain = "https://github.com/anilram30/hf-cable-toolchain"
Report = "https://github.com/anilram30/shieldeval/blob/main/docs/report.pdf"
Issues = "https://github.com/anilram30/shieldeval/issues"
Changelog = "https://github.com/anilram30/shieldeval/blob/main/CHANGELOG.md"

[project.scripts]
shieldeval = "shieldeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shieldeval" = ["fixtures/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E702 and E731: this codebase deliberately groups short related statements on one line
# (plotting calls, tuple unpacking) and uses small lambdas for local helpers.
# E741: `l` reads naturally for an inductance or a length in transmission-line code.
ignore = ["E702", "E731", "E741"]
